    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiliado Express</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      text-align: center;
      padding: 20px 15px;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 680px;
      margin: auto;
      background: #121212;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      border: 1px solid #2a2a2a;
    }

    h1 { font-size: 2.8rem; margin: 0 0 10px 0; color: #ff8800; }
    .subtitle { color: #aaaaaa; font-size: 1.2rem; margin-bottom: 30px; }

    input {
      width: 100%;
      padding: 18px 22px;
      font-size: 1.08rem;
      background: #1e1e1e;
      border: 2px solid #3a3a3a;
      border-radius: 16px;
      color: white;
      outline: none;
      margin-bottom: 25px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #ff8800;
      box-shadow: 0 0 0 5px rgba(255, 136, 0, 0.15);
    }

    button.main {
      padding: 18px 45px;
      font-size: 1.25rem;
      font-weight: 600;
      background: linear-gradient(90deg, #ff8800, #ffaa33);
      color: #000;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }

    button.main:hover { transform: translateY(-4px); }

    #resultado {
      margin-top: 35px;
      padding: 25px;
      background: #1e1e1e;
      border-radius: 20px;
      border: 1px solid #3a3a3a;
      text-align: left;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff8800;
      color: black;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-link"></i> Afiliado Express</h1>
    <p class="subtitle">Gere links de afiliado em segundos</p>

    <input type="text" id="linkInput" placeholder="Cole o link do Mercado Livre, Amazon ou AliExpress...">

    <button class="main" onclick="gerarLink()">
      <i class="fas fa-magic"></i> Gerar Link Afiliado
    </button>

    <div id="resultado"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const mlAfiliado   = "50894264";
    const amazonTag    = "luizabreu0f-20";

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    function gerarLink() {
      const input = document.getElementById("linkInput").value.trim();
      const resultado = document.getElementById("resultado");

      if (!input) {
        showToast("❌ Por favor, cole um link!");
        return;
      }

      let linkGerado = input.trim();
      let plataforma = "";

      // === MELHOR DETECÇÃO ===
      if (input.includes("mercadolivre.com") || input.includes("meli.la")) {
        plataforma = "Mercado Livre";
        linkGerado = linkGerado.split("?")[0] + (linkGerado.includes("?") ? "&" : "?") + `affiliate=${mlAfiliado}`;
      } 
      else if (input.includes("amazon.com") || input.includes("amzn.to")) {
        plataforma = "Amazon";
        linkGerado = linkGerado.split("?")[0] + (linkGerado.includes("?") ? "&" : "?") + `tag=${amazonTag}`;
      } 
      else if (input.includes("aliexpress.com")) {
        plataforma = "AliExpress";
        linkGerado = linkGerado.split("?")[0] + (linkGerado.includes("?") ? "&" : "?") + `aff_short_link=1`;
      } 
      else {
        showToast("❌ Link não reconhecido! Use Mercado Livre, Amazon ou AliExpress.");
        return;
      }

      // Mostra o resultado
      resultado.style.display = "block";
      resultado.innerHTML = `
        <div style="color: #ffaa33; font-weight: 600; margin-bottom: 15px; font-size: 1.25rem;">
          ✅ ${plataforma}
        </div>
        <div style="background: #1e1e1e; padding: 20px; border-radius: 14px; word-break: break-all; border-left: 5px solid #ff8800;">
          <strong>Link gerado:</strong><br><br>
          <a href="\( {linkGerado}" target="_blank" style="color:#ffaa33; text-decoration:none;"> \){linkGerado}</a>
        </div>
        <br>
        <button onclick="copiarLink('${linkGerado}')" 
                style="background:#ff8800; color:black; border:none; padding:16px 40px; border-radius:14px; font-weight:600; cursor:pointer;">
          📋 Copiar Link
        </button>
      `;

      showToast("✅ Link gerado com sucesso!");
    }

    function copiarLink(link) {
      navigator.clipboard.writeText(link).then(() => {
        showToast("✅ Link copiado!");
      });
    }
  </script>
</body>
</html>
